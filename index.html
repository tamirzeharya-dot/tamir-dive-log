<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#062645">
  <title>יומן הצלילה של תמיר</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="apple-touch-icon" href="icon-192.png?v=2">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#062645;color:#fff}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(92vw,420px);text-align:center;background:#0a355d;border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:34px 24px;box-shadow:0 20px 60px rgba(0,0,0,.32)}
    img{width:116px;height:116px;border-radius:26px;margin-bottom:18px}
    h1{font-size:26px;margin:0 0 10px}
    p{line-height:1.6;color:#d8eaff;margin:0 0 24px}
    a{display:block;text-decoration:none;background:#fff;color:#08345d;font-weight:700;padding:16px 20px;border-radius:16px}
    .small{font-size:13px;margin-top:15px;opacity:.8;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <img src="icon-192.png?v=2" alt="אייקון יומן הצלילה">
    <h1>יומן הצלילה של תמיר</h1>
    <p id="statusText">התקן את האפליקציה מהדפדפן, או פתח את היומן מהכפתור.</p>
    <a id="openApp" href="https://script.google.com/macros/s/AKfycbxfooe7VKN_VDLoyZY1QFpl_lXM7JVfatCSS3a_AF7hYrAus2uoxCpt1CVCRocwfw8l/exec">פתח את יומן הצלילה</a>
    <div class="small" id="helperText">לאחר ההתקנה, פתיחה מהאייקון תכניס אותך אוטומטית ליומן.</div>
  </main>
  <script>
    const APP_URL='https://script.google.com/macros/s/AKfycbxfooe7VKN_VDLoyZY1QFpl_lXM7JVfatCSS3a_AF7hYrAus2uoxCpt1CVCRocwfw8l/exec';

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (isStandalone) {
      document.getElementById('statusText').textContent = 'פותח את יומן הצלילה...';
      document.getElementById('helperText').textContent = 'אם המעבר האוטומטי לא מתבצע, לחץ על הכפתור.';
      window.addEventListener('load', () => {
        setTimeout(() => window.location.replace(APP_URL), 400);
      });
    }
  </script>
</body>
</html>
